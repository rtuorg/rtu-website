<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | RTU</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0a1f44,#00aaff);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
overflow:hidden;
}

/* FLOATING CIRCLES */
.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,0.1);
animation:float 6s infinite ease-in-out;
}

.circle:nth-child(1){
width:120px;height:120px;top:10%;left:15%;
}
.circle:nth-child(2){
width:200px;height:200px;bottom:10%;right:15%;
animation-delay:2s;
}
.circle:nth-child(3){
width:80px;height:80px;top:60%;left:70%;
animation-delay:4s;
}

/* CONTENT */
.container{
z-index:2;
}

.container h1{
font-size:120px;
font-weight:700;
animation:glow 2s infinite alternate;
}

.container h2{
font-size:28px;
margin-bottom:10px;
}

.container p{
margin-bottom:25px;
opacity:0.8;
}

/* BUTTONS */
.buttons button{
padding:12px 20px;
margin:5px;
border:none;
border-radius:25px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.home-btn{
background:white;
color:#0a1f44;
}

.back-btn{
background:transparent;
border:2px solid white;
color:white;
}

.buttons button:hover{
transform:scale(1.1);
}

/* COUNTDOWN */
#countdown{
margin-top:15px;
font-size:14px;
opacity:0.7;
}

/* ANIMATIONS */
@keyframes glow{
from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 30px #00aaff;}
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-20px);}
}

/* RESPONSIVE */
@media(max-width:768px){
.container h1{
font-size:70px;
}
.container h2{
font-size:20px;
}
}
</style>
</head>

<body>

<!-- FLOATING BG -->
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">
<h1>404</h1>
<h2>Page Not Found</h2>
<p>The page you are looking for doesn't exist or has been moved.</p>

<div class="buttons">
<button class="home-btn" onclick="goHome()">Go Home</button>
<button class="back-btn" onclick="goBack()">Go Back</button>
</div>

<div id="countdown">Redirecting to homepage in 10 seconds...</div>
</div>

<script>
// HOME REDIRECT
function goHome(){
window.location.href = "/";
}

// BACK BUTTON
function goBack(){
window.history.back();
}

// AUTO REDIRECT
let time = 10;
let countdown = document.getElementById("countdown");

let timer = setInterval(()=>{
time--;
countdown.innerText = "Redirecting to homepage in " + time + " seconds...";
if(time <= 0){
clearInterval(timer);
window.location.href = "/";
}
},1000);
</script>

</body>
</html>
