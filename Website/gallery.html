<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTU Premium Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f6fb;
}

/* NAVBAR */
nav{
    background:#001f3f;
    padding:15px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:25px;
    cursor:pointer;
}

nav ul li:hover{
    color:#00d4ff;
}

/* HERO */
.hero{
    height:60vh;
    background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1');
    background-size:cover;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    flex-direction:column;
}

.hero h1{
    font-size:40px;
    animation:fadeDown 1s ease;
}

/* FILTER BUTTONS */
.filters{
    text-align:center;
    padding:30px;
}

.filters button{
    margin:10px;
    padding:10px 20px;
    border:none;
    background:#001f3f;
    color:white;
    border-radius:20px;
    cursor:pointer;
    transition:0.3s;
}

.filters button:hover{
    background:#00c3ff;
}

/* GALLERY */
.gallery{
    padding:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery-item{
    position:relative;
    overflow:hidden;
    border-radius:12px;
    cursor:pointer;
}

.gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:0.4s;
}

.gallery-item:hover img{
    transform:scale(1.1);
}

.overlay{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.6);
    color:white;
    padding:10px;
    opacity:0;
    transition:0.3s;
}

.gallery-item:hover .overlay{
    opacity:1;
}

/* LIGHTBOX */
.lightbox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
}

.lightbox img{
    max-width:90%;
    max-height:80%;
}

.lightbox:target{
    display:flex;
}

/* FOOTER */
footer{
    background:#001f3f;
    color:white;
    text-align:center;
    padding:20px;
}

/* ANIMATION */
@keyframes fadeDown{
    from{opacity:0; transform:translateY(-30px);}
    to{opacity:1; transform:translateY(0);}
}

/* RESPONSIVE */
@media(max-width:768px){
    nav{
        flex-direction:column;
    }
    .hero h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<nav>
    <h2>RTU Gallery</h2>
    <ul>
        <li>Home</li>
        <li>Gallery</li>
        <li>Events</li>
        <li>Contact</li>
    </ul>
</nav>

<section class="hero">
    <h1>Campus Gallery</h1>
</section>

<div class="filters">
    <button onclick="filterSelection('all')">All</button>
    <button onclick="filterSelection('campus')">Campus</button>
    <button onclick="filterSelection('events')">Events</button>
    <button onclick="filterSelection('labs')">Labs</button>
</div>

<section class="gallery">

<div class="gallery-item campus">
    <img src="https://images.unsplash.com/photo-1562774053-701939374585">
    <div class="overlay">Campus View</div>
</div>

<div class="gallery-item events">
    <img src="https://images.unsplash.com/photo-1511578314322-379afb476865">
    <div class="overlay">College Event</div>
</div>

<div class="gallery-item labs">
    <img src="https://images.unsplash.com/photo-1581091215367-59ab6b4b4e57">
    <div class="overlay">Lab Work</div>
</div>

<div class="gallery-item campus">
    <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b">
    <div class="overlay">Campus Life</div>
</div>

<div class="gallery-item events">
    <img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7">
    <div class="overlay">Fest Event</div>
</div>

<div class="gallery-item labs">
    <img src="https://images.unsplash.com/photo-1581091870627-3c4e75f5f48c">
    <div class="overlay">Engineering Lab</div>
</div>

</section>

<footer>
    <p>© 2021 RTU Gallery | All Rights Reserved</p>
</footer>

<script>
function filterSelection(category){
    let items = document.getElementsByClassName("gallery-item");
    for(let i=0;i<items.length;i++){
        items[i].style.display = (category === "all" || items[i].classList.contains(category)) ? "block" : "none";
    }
}
</script>

</body>
</html>
