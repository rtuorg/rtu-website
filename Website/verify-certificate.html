<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTU Certificate Verification</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
}

/* NAVBAR */
nav{
background:#0a1f44;
color:#fff;
display:flex;
justify-content:space-between;
padding:15px 50px;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:25px;
cursor:pointer;
}

/* HERO */
.hero{
height:60vh;
background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url('https://images.unsplash.com/photo-1562774053-701939374585');
background-size:cover;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
text-align:center;
}

.hero h1{
font-size:42px;
animation:fadeDown 1s ease;
}

/* VERIFY BOX */
.container{
padding:60px 20px;
display:flex;
justify-content:center;
}

.verify-box{
background:#fff;
padding:35px;
border-radius:15px;
width:100%;
max-width:500px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
text-align:center;
}

.verify-box input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

.verify-box button{
width:100%;
padding:12px;
background:#0a1f44;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.verify-box button:hover{
background:#00aaff;
}

/* LOADER */
.loader{
display:none;
margin:20px auto;
border:5px solid #f3f3f3;
border-top:5px solid #0a1f44;
border-radius:50%;
width:40px;
height:40px;
animation:spin 1s linear infinite;
}

/* RESULT CARD */
.result{
margin-top:20px;
display:none;
padding:20px;
border-radius:10px;
text-align:left;
}

.valid{
background:#d4edda;
color:#155724;
}

.invalid{
background:#f8d7da;
color:#721c24;
}

.info{
background:#e2e3e5;
color:#383d41;
}

/* FOOTER */
footer{
background:#0a1f44;
color:white;
text-align:center;
padding:15px;
margin-top:40px;
}

/* ANIMATIONS */
@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

@keyframes fadeDown{
from{opacity:0; transform:translateY(-30px);}
to{opacity:1; transform:translateY(0);}
}

/* RESPONSIVE */
@media(max-width:768px){
nav{
flex-direction:column;
text-align:center;
}
.hero h1{
font-size:28px;
}
}
</style>
</head>

<body>

<nav>
<h2>RTU Portal</h2>
<ul>
<li>Home</li>
<li>Verify</li>
<li>Admissions</li>
<li>Contact</li>
</ul>
</nav>

<section class="hero">
<h1>Certificate Verification</h1>
<p>Rajasthan Technical University Official Portal</p>
</section>

<div class="container">
<div class="verify-box">

<h2>Verify Certificate</h2>

<input type="text" id="certID" placeholder="Enter Certificate ID">
<input type="text" id="name" placeholder="Enter Candidate Name">

<button onclick="verify()">Verify Certificate</button>

<div class="loader" id="loader"></div>

<div id="result" class="result"></div>

</div>
</div>

<footer>
<p>© 2026 RTU | Certificate Verification System</p>
</footer>

<script>
const database = [
{
id:"RTU2026CS001",
name:"Rahul Sharma",
course:"B.Tech Computer Science",
year:"2026",
status:"Valid"
},
{
id:"RTU2025EE021",
name:"Neha Verma",
course:"B.Tech Electrical",
year:"2025",
status:"Valid"
}
];

function verify(){

let id = document.getElementById("certID").value.trim();
let name = document.getElementById("name").value.trim();
let result = document.getElementById("result");
let loader = document.getElementById("loader");

result.style.display="none";
loader.style.display="block";

setTimeout(()=>{

loader.style.display="none";

let record = database.find(c => c.id===id && c.name.toLowerCase()===name.toLowerCase());

if(record){
result.style.display="block";
result.className="result valid";
result.innerHTML = `
<h3>✅ Certificate Verified</h3>
<p><b>Name:</b> ${record.name}</p>
<p><b>Course:</b> ${record.course}</p>
<p><b>Year:</b> ${record.year}</p>
<p><b>Status:</b> ${record.status}</p>
`;
}
else if(id === "" || name === ""){
result.style.display="block";
result.className="result info";
result.innerHTML = "<h3>⚠️ Please enter all details</h3>";
}
else{
result.style.display="block";
result.className="result invalid";
result.innerHTML = "<h3>❌ Certificate Not Found</h3>";
}

},1500);
}
</script>

</body>
</html>
